name: Build and Publish Docker Image

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC

permissions:
  contents: read
  packages: write

jobs:
  base:
    uses: ./.github/workflows/build-image.yml
    with:
      variant: base
      dockerfile: docker/cpr-base.Dockerfile
      distros: '["humble", "jazzy", "lyrical", "rolling"]'
      multiarch: true

  dev:
    needs: base
    uses: ./.github/workflows/build-image.yml
    with:
      variant: dev
      parent: base
      dockerfile: docker/cpr-dev.Dockerfile
      distros: '["humble", "jazzy", "lyrical", "rolling"]'
      multiarch: true

  ci:
    needs: base
    uses: ./.github/workflows/build-image.yml
    with:
      variant: ci
      parent: base
      dockerfile: docker/cpr-ci.Dockerfile
      distros: '["humble", "jazzy", "lyrical", "rolling"]'

  ci-common:
    needs: ci
    uses: ./.github/workflows/build-image.yml
    with:
      variant: ci-common
      parent: ci
      dockerfile: docker/cpr-ci-common.Dockerfile
      distros: '["humble", "jazzy"]'

  ci-robot:
    needs: ci
    uses: ./.github/workflows/build-image.yml
    with:
      variant: ci-robot
      parent: ci
      dockerfile: docker/cpr-ci-robot.Dockerfile
      distros: '["humble", "jazzy"]'

  robot:
    needs: base
    uses: ./.github/workflows/build-image.yml
    with:
      variant: robot
      parent: base
      dockerfile: docker/cpr-robot.Dockerfile
      distros: '["jazzy"]'

  robot-humble:
    needs: base
    uses: ./.github/workflows/build-image.yml
    with:
      variant: robot
      parent: base
      dockerfile: docker/cpr-robot-humble.Dockerfile
      distros: '["humble"]'

  sim:
    needs: dev
    uses: ./.github/workflows/build-image.yml
    with:
      variant: sim
      parent: dev
      dockerfile: docker/cpr-sim.Dockerfile
      distros: '["humble", "jazzy"]'

  nav2:
    needs: dev
    uses: ./.github/workflows/build-image.yml
    with:
      variant: nav2
      parent: dev
      dockerfile: docker/cpr-nav2.Dockerfile
      distros: '["humble", "jazzy"]'

  viz:
    needs: dev
    uses: ./.github/workflows/build-image.yml
    with:
      variant: viz
      parent: dev
      dockerfile: docker/cpr-viz.Dockerfile
      distros: '["humble", "jazzy"]'

  foxglove-bridge:
    needs: base
    uses: ./.github/workflows/build-image.yml
    with:
      variant: foxglove-bridge
      parent: base
      dockerfile: docker/cpr-foxglove-bridge.Dockerfile
      distros: '["humble", "jazzy"]'
