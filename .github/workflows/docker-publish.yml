name: Build and Publish Docker Image

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC

permissions:
  contents: read
  packages: write

jobs:
  base:
    uses: ./.github/workflows/build-image.yml
    with:
      variant: base
      dockerfile: docker/cpr-base.Dockerfile
      distros: '["humble", "jazzy", "lyrical", "rolling"]'
      multiarch: true

  dev:
    needs: base
    uses: ./.github/workflows/build-image.yml
    with:
      variant: dev
      parent: base
      dockerfile: docker/cpr-dev.Dockerfile
      distros: '["humble", "jazzy", "lyrical", "rolling"]'
      multiarch: true

  ci:
    needs: base
    uses: ./.github/workflows/build-image.yml
    with:
      variant: ci
      parent: base
      dockerfile: docker/cpr-ci.Dockerfile
      distros: '["humble", "jazzy", "lyrical", "rolling"]'

  ci-common:
    needs: ci
    uses: ./.github/workflows/build-image.yml
    with:
      variant: ci-common
      parent: ci
      dockerfile: docker/cpr-ci-common.Dockerfile
      distros: '["humble", "jazzy"]'

  ci-robot:
    needs: ci
    uses: ./.github/workflows/build-image.yml
    with:
      variant: ci-robot
      parent: ci
      dockerfile: docker/cpr-ci-robot.Dockerfile
      distros: '["humble", "jazzy"]'

  robot:
    needs: base
    uses: ./.github/workflows/build-image.yml
    with:
      variant: robot
      parent: base
      dockerfile: docker/cpr-robot.Dockerfile
      distros: '["jazzy"]'

  robot-humble:
    needs: base
    uses: ./.github/workflows/build-image.yml
    with:
      variant: robot
      parent: base
      dockerfile: docker/cpr-robot-humble.Dockerfile
      distros: '["humble"]'

  sim:
    needs: dev
    uses: ./.github/workflows/build-image.yml
    with:
      variant: sim
      parent: dev
      dockerfile: docker/cpr-sim.Dockerfile
      distros: '["humble", "jazzy"]'
      multiarch: true

  nav2:
    needs: dev
    uses: ./.github/workflows/build-image.yml
    with:
      variant: nav2
      parent: dev
      dockerfile: docker/cpr-nav2.Dockerfile
      distros: '["humble", "jazzy"]'
      multiarch: true

  viz:
    needs: dev
    uses: ./.github/workflows/build-image.yml
    with:
      variant: viz
      parent: dev
      dockerfile: docker/cpr-viz.Dockerfile
      distros: '["humble", "jazzy"]'
      multiarch: true

  foxglove-bridge:
    needs: base
    uses: ./.github/workflows/build-image.yml
    with:
      variant: foxglove-bridge
      parent: base
      dockerfile: docker/cpr-foxglove-bridge.Dockerfile
      distros: '["humble", "jazzy"]'
      multiarch: true

  stack-test:
    needs: [sim, nav2]
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [jazzy]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run sim + nav2 stack test
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.number }}
          DISTRO: ${{ matrix.ros_distro }}
          REPO: ghcr.io/${{ github.repository }}
        run: |
          case "$EVENT" in
            pull_request) suffix="pr-$PR" ;;
            schedule) suffix=nightly ;;
            *) suffix=latest ;;
          esac
          test/stack-test.sh "$DISTRO" "$REPO:$DISTRO-sim-$suffix" "$REPO:$DISTRO-nav2-$suffix"
