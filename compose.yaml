# Compose file for the Clearpath dev, sim, and viz images.
#
# Usage:
#   docker compose up -d dev
#   docker compose exec dev bash
#   docker compose up sim                 # Launch simulation only
#   docker compose up nav2                # Launch Nav2 demos only
#   docker compose up viz                 # Launch visualization only
#   docker compose up sim nav2 viz        # Launch simulation + Nav2 + visualization
#   docker compose -f compose-sim-viz-nav2.yaml up  # Launch sim + nav2 + viz together
#
# Override knobs (set in a .env file or on the command line):
#   ROS_DISTRO  - humble | jazzy | lyrical | rolling (default: jazzy)
#   ROS2_WS     - path to your ROS 2 workspace on the host (default: ~/ros2_ws)
#   SETUP_PATH  - setup path passed to clearpath_gz simulation launch
#                 (default in container: /etc/clearpath)
#   SETUP_PATH_HOST - host directory to mount into /etc/clearpath
#                     (default: $HOME/clearpath/)
#   USE_SIM_TIME - true/false for Nav2 demos in simulation (default: true)
#   SCAN_TOPIC   - optional lidar topic override for 3D lidar setups
#   CYCLONEDDS_CONFIG - host CycloneDDS profile (default: ./config/cyclonedds.xml)
#
# For host-specific tweaks (USB devices, extra mounts, etc.), create a
# compose.override.yaml — see compose.override.yaml.example.
#
# Healthchecks come from the images (scripts/cpr-healthcheck.sh).

services:
  dev:
    image: ghcr.io/clearpathrobotics/clearpath_docker:${ROS_DISTRO:-jazzy}-dev-latest
    container_name: cpr-dev-${ROS_DISTRO:-jazzy}
    network_mode: host
    working_dir: /ros2_ws
    volumes:
      - ${ROS2_WS:-~/ros2_ws}:/ros2_ws
      - ${HOME}/.clearpath_docker_history:/commandhistory
    stdin_open: true
    tty: true
    command: bash

  # *-local services: the same images rebuilt to run as your host uid/gid, so
  # mounted files are owned by you. Run all local containers together; DDS shared
  # memory doesn't pass data between different uids.
  #
  #   USER_UID=$(id -u) USER_GID=$(id -g) docker compose up -d --build dev-local
  #   docker compose exec dev-local bash
  dev-local:
    extends:
      service: dev
    image: cpr-dev:${ROS_DISTRO:-jazzy}-local
    container_name: cpr-dev-${ROS_DISTRO:-jazzy}-local
    build:
      context: .
      dockerfile: docker/cpr-local-user.Dockerfile
      args:
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
        CPR_BASE_IMAGE: ghcr.io/clearpathrobotics/clearpath_docker
        CPR_BASE_TAG: ${ROS_DISTRO:-jazzy}-dev-latest
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}

  sim:
    image: ghcr.io/clearpathrobotics/clearpath_docker:${ROS_DISTRO:-jazzy}-sim-latest
    container_name: cpr-sim-${ROS_DISTRO:-jazzy}
    # Only started when named, so `up nav2` / `up viz` alone don't pull in the sim
    profiles: [sim]
    network_mode: host
    ipc: host
    environment:
      SETUP_PATH: ${SETUP_PATH:-/etc/clearpath}
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /tmp/.Xauthority
      GAZEBO_STARTUP_TIMEOUT: ${GAZEBO_STARTUP_TIMEOUT:-120}
      GAZEBO_MAX_RESTARTS: ${GAZEBO_MAX_RESTARTS:-3}
      GAZEBO_HEADLESS: ${GAZEBO_HEADLESS:-false}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      ROS_AUTOMATIC_DISCOVERY_RANGE: ${ROS_AUTOMATIC_DISCOVERY_RANGE:-LOCALHOST}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      CYCLONEDDS_URI: ${CYCLONEDDS_URI:-file:///etc/cpr/cyclonedds.xml}
    volumes:
      - ${SETUP_PATH_HOST:-${HOME}/clearpath/}:/etc/clearpath/:rw  # rw: sim generates URDF, SRDF, configs
      - ${CYCLONEDDS_CONFIG:-./config/cyclonedds.xml}:/etc/cpr/cyclonedds.xml:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.Xauthority:/tmp/.Xauthority:ro
      - gz_fuel_cache:/var/cache/gz/fuel
    stdin_open: true
    tty: true

  #   USER_UID=$(id -u) USER_GID=$(id -g) docker compose up --build sim-local nav2-local viz-local
  sim-local:
    extends:
      service: sim
    image: cpr-sim:${ROS_DISTRO:-jazzy}-local
    container_name: cpr-sim-${ROS_DISTRO:-jazzy}-local
    build:
      context: .
      dockerfile: docker/cpr-local-user.Dockerfile
      args:
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
        CPR_BASE_IMAGE: ghcr.io/clearpathrobotics/clearpath_docker
        CPR_BASE_TAG: ${ROS_DISTRO:-jazzy}-sim-latest
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    volumes:
      # Separate from sim's cache, which is owned by uid 1000
      - gz_fuel_cache_local:/var/cache/gz/fuel

  nav2:
    image: cpr-nav2:${ROS_DISTRO:-jazzy}
    container_name: cpr-nav2-${ROS_DISTRO:-jazzy}
    build:
      context: .
      dockerfile: docker/cpr-nav2.Dockerfile
      args:
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
        CPR_BASE_IMAGE: ghcr.io/clearpathrobotics/clearpath_docker
        CPR_BASE_TAG: ${ROS_DISTRO:-jazzy}-dev-latest
    network_mode: host
    environment:
      SETUP_PATH: ${SETUP_PATH:-/etc/clearpath}
      ROBOT_NAMESPACE: ${ROBOT_NAMESPACE:-}
      USE_SIM_TIME: ${USE_SIM_TIME:-true}
      WAIT_FOR_SIM: ${WAIT_FOR_SIM:-false}
      WAIT_FOR_TIMEOUT_SEC: ${WAIT_FOR_TIMEOUT_SEC:-120}
      SCAN_TOPIC: ${SCAN_TOPIC:-}
      NAV2_LAUNCH_FILE: ${NAV2_LAUNCH_FILE:-nav2.launch.py}
      NAV2_ENABLE_SLAM: ${NAV2_ENABLE_SLAM:-false}
      NAV2_SLAM_SYNC: ${NAV2_SLAM_SYNC:-false}
      AUTO_NAV2_STARTUP: ${AUTO_NAV2_STARTUP:-true}
      NAV2_STARTUP_TIMEOUT_S: ${NAV2_STARTUP_TIMEOUT_S:-120}
      NAV2_SERVICE_CALL_TIMEOUT_S: ${NAV2_SERVICE_CALL_TIMEOUT_S:-8}
      NAV2_ACTIVE_WAIT_TIMEOUT_S: ${NAV2_ACTIVE_WAIT_TIMEOUT_S:-60}
      NAV2_TOPIC_WAIT_TIMEOUT_S: ${NAV2_TOPIC_WAIT_TIMEOUT_S:-120}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      ROS_AUTOMATIC_DISCOVERY_RANGE: ${ROS_AUTOMATIC_DISCOVERY_RANGE:-LOCALHOST}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      CYCLONEDDS_URI: ${CYCLONEDDS_URI:-file:///etc/cpr/cyclonedds.xml}
    volumes:
      - ${SETUP_PATH_HOST:-${HOME}/clearpath/}:/etc/clearpath/:ro  # ro: nav2 only reads config
      - ${CYCLONEDDS_CONFIG:-./config/cyclonedds.xml}:/etc/cpr/cyclonedds.xml:ro
    depends_on:
      # Waits for the sim only if it's started in the same command
      sim:
        condition: service_healthy
        required: false
    stdin_open: true
    tty: true

  nav2-local:
    extends:
      service: nav2
    image: cpr-nav2:${ROS_DISTRO:-jazzy}-local
    container_name: cpr-nav2-${ROS_DISTRO:-jazzy}-local
    build: !override
      context: .
      dockerfile: docker/cpr-local-user.Dockerfile
      args:
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
        CPR_BASE_IMAGE: ghcr.io/clearpathrobotics/clearpath_docker
        CPR_BASE_TAG: ${ROS_DISTRO:-jazzy}-nav2-latest
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    depends_on: !override
      sim-local:
        condition: service_healthy
        required: false

  viz:
    image: ghcr.io/clearpathrobotics/clearpath_docker:${ROS_DISTRO:-jazzy}-viz-latest
    container_name: cpr-viz-${ROS_DISTRO:-jazzy}
    network_mode: host
    devices:
      - /dev/dri:/dev/dri
    ipc: host
    environment:
      SETUP_PATH: ${SETUP_PATH:-/etc/clearpath}
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /tmp/.Xauthority
      ROBOT_NAMESPACE: ${ROBOT_NAMESPACE:-}
      USE_SIM_TIME: ${USE_SIM_TIME:-true}
      WAIT_FOR_TIMEOUT_SEC: ${WAIT_FOR_TIMEOUT_SEC:-120}
      CLEARPATH_VIZ_CONFIG: ${CLEARPATH_VIZ_CONFIG:-robot}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      ROS_AUTOMATIC_DISCOVERY_RANGE: ${ROS_AUTOMATIC_DISCOVERY_RANGE:-LOCALHOST}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      CYCLONEDDS_URI: ${CYCLONEDDS_URI:-file:///etc/cpr/cyclonedds.xml}
    volumes:
      - ${SETUP_PATH_HOST:-${HOME}/clearpath/}:/etc/clearpath/:ro  # ro: viz only reads config
      - ${CYCLONEDDS_CONFIG:-./config/cyclonedds.xml}:/etc/cpr/cyclonedds.xml:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.Xauthority:/tmp/.Xauthority:ro
    depends_on:
      sim:
        condition: service_healthy
        required: false
    stdin_open: true
    tty: true

  viz-local:
    extends:
      service: viz
    image: cpr-viz:${ROS_DISTRO:-jazzy}-local
    container_name: cpr-viz-${ROS_DISTRO:-jazzy}-local
    build:
      context: .
      dockerfile: docker/cpr-local-user.Dockerfile
      args:
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
        CPR_BASE_IMAGE: ghcr.io/clearpathrobotics/clearpath_docker
        CPR_BASE_TAG: ${ROS_DISTRO:-jazzy}-viz-latest
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    depends_on: !override
      sim-local:
        condition: service_healthy
        required: false

  # ─── Robot (real hardware) ────────────────────────────────────────────
  # Controls the physical robot via USB, Ethernet, and CAN bus.
  # Requires: SETUP_PATH_HOST pointing to a directory containing robot.yaml.
  #
  # Usage (see README "Running on a robot" for host setup):
  #   SETUP_PATH_HOST=$HOME/clearpath docker compose up -d robot
  #   ROS_DISTRO=humble SETUP_PATH_HOST=$HOME/clearpath docker compose up -d robot
  robot:
    image: ghcr.io/clearpathrobotics/clearpath_docker:${ROS_DISTRO:-jazzy}-robot-latest
    container_name: cpr-robot-${ROS_DISTRO:-jazzy}
    privileged: true
    network_mode: host
    cgroup: host
    environment:
      container: docker
      SETUP_PATH: ${SETUP_PATH:-/etc/clearpath}
      ROS_DISTRO: ${ROS_DISTRO:-jazzy}
      # For docker exec shells only; the robot services take these from robot.yaml
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      ROS_AUTOMATIC_DISCOVERY_RANGE: ${ROS_AUTOMATIC_DISCOVERY_RANGE:-LOCALHOST}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      CYCLONEDDS_URI: ${CYCLONEDDS_URI:-file:///etc/cpr/cyclonedds.xml}
    volumes:
      - ${SETUP_PATH_HOST:-${HOME}/clearpath/}:/etc/clearpath/  # rw (default): robot may write logs/updates
      - ${CYCLONEDDS_CONFIG:-./config/cyclonedds.xml}:/etc/cpr/cyclonedds.xml:ro
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - NET_RAW
    tmpfs:
      - /run
      - /run/lock
    stdin_open: true
    tty: true

  # Runs as root like robot; only the Clearpath user is re-numbered to your uid/gid.
  #
  #   USER_UID=$(id -u) USER_GID=$(id -g) SETUP_PATH_HOST=~/clearpath_robot docker compose up --build robot-local
  #   ROS_DISTRO=humble ... robot-local   # user is administrator
  robot-local:
    extends:
      service: robot
    image: cpr-robot:${ROS_DISTRO:-jazzy}-local
    container_name: cpr-robot-${ROS_DISTRO:-jazzy}-local
    build:
      context: .
      dockerfile: docker/cpr-local-user.Dockerfile
      args:
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
        CPR_BASE_IMAGE: ghcr.io/clearpathrobotics/clearpath_docker
        CPR_BASE_TAG: ${ROS_DISTRO:-jazzy}-robot-latest
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
        RUNTIME_USER: root

volumes:
  gz_fuel_cache:
  gz_fuel_cache_local:
