# Preset for running sim, nav2 (with SLAM), and viz (navigation view) together.
# Services come from compose.yaml; only the nav demo defaults differ.
#
# Usage:
#   xhost +local:
#   SETUP_PATH_HOST=$HOME/clearpath ROS_DISTRO=jazzy docker compose -f compose-sim-viz-nav2.yaml up

services:
  sim:
    extends:
      file: compose.yaml
      service: sim
    profiles: !reset []

  nav2:
    extends:
      file: compose.yaml
      service: nav2
    environment:
      NAV2_ENABLE_SLAM: ${NAV2_ENABLE_SLAM:-true}

  viz:
    extends:
      file: compose.yaml
      service: viz
    environment:
      CLEARPATH_VIZ_CONFIG: ${CLEARPATH_VIZ_CONFIG:-navigation}

volumes:
  gz_fuel_cache:
